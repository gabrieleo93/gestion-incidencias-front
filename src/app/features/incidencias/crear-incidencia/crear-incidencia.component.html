<section class="crear-incidencia-container">
  <h2>Crear incidencia</h2>

  <form [formGroup]="incidenciaForm" (ngSubmit)="crearIncidencia()">

    <div class="form-group">
      <label for="titulo">Título</label>
      <input
        id="titulo"
        type="text"
        formControlName="titulo"
        placeholder="Ejemplo: No puedo acceder al sistema"
      />

      <small
        class="error"
        *ngIf="incidenciaForm.get('titulo')?.touched && incidenciaForm.get('titulo')?.invalid"
      >
        El título es obligatorio y no puede superar los 120 caracteres.
      </small>
    </div>

    <div class="form-group">
      <label for="descripcion">Descripción</label>
      <textarea
        id="descripcion"
        formControlName="descripcion"
        rows="5"
        placeholder="Describe el problema con detalle"
      ></textarea>

      <small
        class="error"
        *ngIf="incidenciaForm.get('descripcion')?.touched && incidenciaForm.get('descripcion')?.invalid"
      >
        La descripción es obligatoria.
      </small>
    </div>

    <div class="form-group">
      <label for="prioridad">Prioridad</label>
      <select id="prioridad" formControlName="prioridad">
        <option *ngFor="let prioridad of prioridades" [value]="prioridad">
          {{ prioridad }}
        </option>
      </select>
    </div>

    <p class="error" *ngIf="mensajeError">
      {{ mensajeError }}
    </p>

    <div class="buttons">
      <button type="submit">Crear incidencia</button>
      <button type="button" class="secondary" (click)="cancelar()">Cancelar</button>
    </div>

  </form>
</section>

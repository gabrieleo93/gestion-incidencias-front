<section class="incidencias-container">
  <h2>Listado de incidencias</h2>
  <button class="crear-btn" routerLink="/incidencias/nueva" *ngIf="puedeCrearIncidencia()">
    Nueva incidencia
  </button>

  <p *ngIf="mensajeError" class="error">
    {{ mensajeError }}
  </p>

  <p *ngIf="incidencias.length === 0 && !mensajeError">
    No hay incidencias para mostrar.
  </p>

  <table *ngIf="incidencias.length > 0">
    <thead>
      <tr>
        <th>ID</th>
        <th>Título</th>
        <th>Estado</th>
        <th>Prioridad</th>
        <th>Usuario creador</th>
        <th>Fecha creación</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let incidencia of incidencias">
        <td>{{ incidencia.id }}</td>
        <td>{{ incidencia.titulo }}</td>
        <td>{{ incidencia.estado }}</td>
        <td>{{ incidencia.prioridad }}</td>
        <td>{{ incidencia.nombreUsuarioCreador }}</td>
        <td>{{ incidencia.fechaCreacion }}</td>
      </tr>
    </tbody>
  </table>
</section>

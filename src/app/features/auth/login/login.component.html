<!-- Cambio visual: estructura de login más limpia y centrada para portfolio. -->
<div class="login-page">
  <section class="login-container">
    <div class="login-header">
      <span class="login-kicker">Gestión de incidencias</span>
      <h2>Iniciar sesión</h2>
      <p>Accede al panel para consultar y gestionar incidencias.</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="login()">
      <div class="form-group">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="Introduce tu email"
        />

        <small
          class="error"
          *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid"
        >
          El email es obligatorio y debe tener un formato válido.
        </small>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="Introduce tu contraseña"
          autocomplete="current-password"
        />

        <small
          class="error"
          *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid"
        >
          La contraseña es obligatoria.
        </small>
      </div>

      <button type="submit">Entrar</button>

      <p class="error error-panel" *ngIf="mensajeError">
        {{ mensajeError }}
      </p>
    </form>
  </section>
</div>

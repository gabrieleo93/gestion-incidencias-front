<!-- Cambio visual: navbar más cuidada con marca, navegación y usuario agrupados. -->
<nav class="navbar" *ngIf="authService.estaAutenticado()">
  <div class="navbar__brand">
    <span class="navbar__logo">GI</span>
    <span>Gestión de Incidencias</span>
  </div>

  <div class="navbar__links">
    <a routerLink="/incidencias">Incidencias</a>
    <a routerLink="/incidencias/nueva" *ngIf="puedeCrearIncidencia()">Nueva incidencia</a>
  </div>

  <div class="navbar__user">
    <div class="navbar__identity">
      <span class="navbar__name">{{ nombreUsuario }}</span>
      <span class="navbar__role">{{ rolUsuario }}</span>
    </div>
    <button type="button" (click)="cerrarSesion()">Cerrar sesión</button>
  </div>
</nav>
